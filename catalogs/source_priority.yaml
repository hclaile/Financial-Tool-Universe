  retry_delay: 1s
  source_retry_delays: {yfinance: 5s}
  source_rate_limit_cooldown: {yfinance: 10s}
  source_concurrency: {yfinance: 1}
  circuit_breaker: {failure_threshold: 3, reset_timeout: 30s}
