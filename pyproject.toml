[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tool-universe"
version = "0.1.0"
description = "One MCP server for a unified financial tool catalog"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "mcp>=1.19,<1.20",
  "httpx>=0.24",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.28",
  "pyarrow>=12",
  "starlette>=0.27",
  "uvicorn>=0.23",
]

[project.optional-dependencies]
qlib = ["pyqlib>=0.9.7", "scikit-learn>=1.3", "joblib>=1.3", "pyarrow>=12"]
crawlers = ["yfinance>=0.2", "akshare>=1.12", "praw>=7.7"]
research = ["transformers>=4.40", "torch>=2.1", "weasyprint>=60", "mplfinance>=0.12"]
training = ["fastapi>=0.100", "uvicorn>=0.23", "pyqlib>=0.9.7"]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
finance-tool-universe = "finance_tool_universe.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["finance_tool_universe*", "financial_tool*"]

[tool.setuptools.data-files]
"share/finance-tool-universe" = ["config.example.yaml"]
"share/finance-tool-universe/catalogs" = ["catalogs/*.json", "catalogs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
