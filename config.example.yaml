# Copy to config.yaml. Fill only the providers you intend to use.
server:
  name: finance-tool-universe
  transport: stdio
  host: 127.0.0.1
  port: 8000
  allowed_ips: []  # MCP HTTP client CIDRs; required for a non-loopback host
network:
  proxy_url: ''
  user_agent: ''
  allowed_ips: []
paths:
  data_dir: data
  output_dir: output
  qlib_cn_data: data/qlib/cn_data
  qlib_us_data: data/qlib/us_data
  alphaqcm_repo: external/AlphaQCM
  alphaforge_repo: external/AlphaForge
  alphasage_repo: external/AlphaSAGE
  qlib_benchmarks: external/qlib_benchmark/benchmarks
  finbert_model: ''
credentials:
  FMP_API_KEY: ''
  FRED_API_KEY: ''
  TUSHARE_TOKEN: ''
  ALPHAVANTAGE_API_KEY: ''
  FINNHUB_API_KEY: ''
  NEWS_API_KEY: ''
  ALPACA_API_KEY_ID: ''
  ALPACA_API_SECRET_KEY: ''
  TAVILY_API_KEY: ''
  GOOGLE_SEARCH_API_KEY: ''
  GOOGLE_SEARCH_CX: ''
  SERPAPI_API_KEY: ''
  GOOGLE_KG_API_KEY: ''
  SEC_API_KEY: ''
  REDDIT_CLIENT_ID: ''
  REDDIT_CLIENT_SECRET: ''
  MINERU_API_KEY: ''
  WIKIPEDIA_API_TOKEN: ''
  WIKIPEDIA_APP_NAME: ''
  OPENAI_API_KEY: ''
  LSEG_MCP_TOKEN: ''
  SPGLOBAL_MCP_TOKEN: ''
  VIBE_TRADING_MCP_TOKEN: ''
  VIBE_TRADING_MCP_URL: ''
sources:
  mineru:
    enabled: true
    base_url: https://mineru.net/api/pdf2json
  tushare:
    enabled: true
    priority: 3
    base_url: https://api.tushare.pro
    token_env: TUSHARE_TOKEN
    rate_limit: 200/min
  akshare:
    enabled: true
    priority: 1
    rate_limit: 60/min
  yfinance:
    enabled: true
    priority: 2
    rate_limit: 30/min
  okx:
    enabled: true
    priority: 1
    base_url: https://www.okx.com/api/v5
    rate_limit: 20/min
  ccxt:
    enabled: true
    priority: 2
    rate_limit: 60/min
  fmp:
    enabled: true
    priority: 2
    base_url: https://financialmodelingprep.com/stable
    token_env: FMP_API_KEY
    rate_limit: 300/min
  sec_edgar:
    enabled: true
    priority: 3
    base_url: https://efts.sec.gov/LATEST/search-index?q=
    rate_limit: 10/min
    user_agent_env: FTU_USER_AGENT
  fred:
    enabled: true
    priority: 1
    base_url: https://api.stlouisfed.org/fred
    token_env: FRED_API_KEY
    rate_limit: 120/min
  alphavantage:
    enabled: true
    priority: 2
    base_url: https://www.alphavantage.co/query
    token_env: ALPHAVANTAGE_API_KEY
    rate_limit: 25/min
  finnhub:
    enabled: true
    priority: 2
    base_url: https://finnhub.io/api/v1
    token_env: FINNHUB_API_KEY
    rate_limit: 60/min
  news_api:
    enabled: true
    priority: 2
    base_url: https://newsapi.org/v2
    token_env: NEWS_API_KEY
    rate_limit: 60/min
  alpaca_news:
    enabled: true
    priority: 2
    base_url: https://data.alpaca.markets/v1beta1
    key_id_env: ALPACA_API_KEY_ID
    secret_key_env: ALPACA_API_SECRET_KEY
    rate_limit: 200/min
  onchain:
    enabled: true
    priority: 1
    rate_limit: 30/min
  local_files:
    enabled: true
    priority: 10
  external_mcp:
    enabled: true
    priority: 0
    servers:
      vibe_trading:
        url: ${VIBE_TRADING_MCP_URL}
        auth_token_env: VIBE_TRADING_MCP_TOKEN
      lseg:
        url: ''
        auth_token_env: LSEG_MCP_TOKEN
      spglobal:
        url: ''
        auth_token_env: SPGLOBAL_MCP_TOKEN
  tavily:
    enabled: true
    priority: 1
    base_url: https://api.tavily.com
    token_env: TAVILY_API_KEY
    rate_limit: 30/min
  google_search:
    enabled: true
    priority: 2
    token_env: GOOGLE_SEARCH_API_KEY
    allow_unauthenticated_fallback: true
    cx_env: GOOGLE_SEARCH_CX
    rate_limit: 30/min
  serpapi:
    enabled: true
    priority: 2
    base_url: https://serpapi.com/search.json
    token_env: SERPAPI_API_KEY
    rate_limit: 30/min
  google_knowledge_graph:
    enabled: true
    priority: 2
    base_url: https://kgsearch.googleapis.com/v1/entities:search
    token_env: GOOGLE_KG_API_KEY
    rate_limit: 30/min
  wikipedia:
    enabled: true
    priority: 2
    base_url: https://api.wikimedia.org/core/v1/wikipedia/en
    api_base_url: https://en.wikipedia.org/w/api.php
    user_agent_env: FTU_USER_AGENT
    rate_limit: 30/min
  web_scraper:
    enabled: true
    priority: 2
    user_agent_env: FTU_USER_AGENT
    rate_limit: 10/min
  sec_api:
    enabled: true
    priority: 2
    base_url: https://api.sec-api.io
    token_env: SEC_API_KEY
    rate_limit: 10/min
permissions:
  default_role: admin
  roles:
    viewer:
      tools:
      - market_data.*
      - fundamentals.*
      - macro.*
      - news.*
      - search.*
      - documents.read
    analyst:
      inherits: viewer
      tools:
      - filings.*
      - funds_etf.*
      - derivatives.*
      - risk.*
      - flows.*
      - sentiment.*
    trader:
      inherits: analyst
      tools:
      - crypto.*
      - onchain.*
      - market_data.realtime
    admin:
      inherits: trader
      tools:
      - '*'
  tool_overrides:
    market_data.realtime:
      require_role: trader
    filings.bulk_download:
      require_role: analyst
      rate_limit_override: 5/min
cache:
  cache:
    enabled: true
    backend: memory
    ttl:
      market_data.quote: 30s
      market_data.history: 3600s
      fundamentals.statement: 86400s
      filings.search: 7200s
      macro.series: 3600s
      news.headlines: 300s
      crypto.price: 15s
      onchain.balance: 60s
      search: 1800s
    max_entries: 10000
    redis_url: redis://localhost:6379/0
    file_path: ./cache
rate_limits:
  rate_limits:
    default:
      requests: 60
      window: min
      burst: 10
    per_tool:
      market_data.realtime:
        requests: 120
        window: min
        burst: 20
      filings.search:
        requests: 30
        window: min
        burst: 5
      onchain.query:
        requests: 30
        window: min
        burst: 5
    per_source:
      tushare:
        requests: 200
        window: min
      fred:
        requests: 120
        window: min
      sec_edgar:
        requests: 10
        window: min
    retry:
      max_attempts: 3
      backoff_base: 1s
      backoff_max: 30s
